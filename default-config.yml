# Default Opsimate Configuration
# This configuration is built into the Docker image and used when no custom config is provided

# Server configuration
server:
  port: 3001
  host: "0.0.0.0"  # Bind to all interfaces in container

# Database configuration
database:
  path: "/app/data/database/opsimate.db"  # Container path

# Security configuration
security:
  private_keys_path: "/app/data/private-keys"  # Container path for SSH keys
  api_token: "opsimate"

# mailer configuration
# Email functionality is disabled by default for security
# To enable email features:
# 1. Set enabled: true
# 2. Configure valid SMTP credentials below
# 3. Update mailLinkBaseUrl to your actual domain
mailer:
  enabled: false
  default_encoding: "UTF-8"
  host: "smtp.gmail.com"  # Replace with your SMTP server
  port: 587                
  secure: false
  mailLinkBaseUrl: "http://localhost:8080" # Base URL for links in emails
  from: "<no-reply@yourdomain.com>"
  replyTo: "ops@yourdomain.com"
  templates:
    # Block style, not a multi-line flow mapping ({ ... } spanning lines): the closing
    # brace sat at the same indent as its key, which strict YAML parsers reject.
    welcomeTemplate:
      subject: "Welcome to OpsiMate!"
      content: "Welcome aboard! We're happy to have you as part of the OpsiMate community."
  auth:
    user: "your-email@domain.com"  # Replace with your SMTP username
    pass: "your-smtp-password"     # Replace with your SMTP password
  tls:
    rejectUnauthorized: true

# LDAP / Active Directory login (optional, off by default)
# Directory users sign in with their email + directory password; their OpsiMate account
# is created on first login and its role follows their groups at every login.
# Local accounts (e.g. the first admin) keep signing in locally even when LDAP is down.
# Every key can also be set with an LDAP_* environment variable (see configuration_example/README.md).
# ldap:
#   enabled: true
#   url: "ldaps://ldap.example.com:636"      # or ldap://...:389 with start_tls: true
#   start_tls: false
#   bind_dn: "cn=opsimate,ou=service,dc=example,dc=com"  # read-only service account
#   bind_password: "change-me"
#   search_base: "ou=people,dc=example,dc=com"
#   search_filter: "(mail={{email}})"        # AD: "(&(objectClass=user)(mail={{email}}))"
#   name_attribute: "displayName"
#   groups_attribute: "memberOf"             # AD / OpenLDAP with the memberOf overlay
#   # group_search_base: "ou=groups,dc=example,dc=com"   # directories without memberOf
#   # group_search_filter: "(member={{dn}})"
#   role_mapping:                            # full group DN or bare group name; highest role wins
#     admin: ["cn=opsimate-admins,ou=groups,dc=example,dc=com"]
#     editor: ["sre"]
#     viewer: ["engineering"]
#   # default_role: viewer                   # for users in none of the groups; omit to refuse them
#   tls:
#     rejectUnauthorized: true
#     # ca_file: "/app/data/ldap-ca.pem"
