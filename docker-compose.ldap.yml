# A throwaway LDAP directory for trying out Directory login (Settings -> Users ->
# Directory login) without a real Active Directory / OpenLDAP at hand.
#
#   docker compose -f docker-compose.ldap.yml up -d
#
# It is rroemhild/docker-test-openldap: an OpenLDAP pre-seeded with the Planet Express
# crew under ou=people,dc=planetexpress,dc=com (admin: cn=admin,dc=planetexpress,dc=com /
# GoodNewsEveryone), with the memberOf overlay enabled, so group -> role mapping works
# out of the box. Nothing persists; `down` throws it away. Settings to paste into the page are in
# configuration_example/README.md ("Trying it out with a test directory").
#
# Plain LDAP is on 10389 and LDAPS (self-signed certificate) on 10636.
services:
  test-ldap:
    image: ghcr.io/rroemhild/docker-test-openldap:master
    container_name: opsimate-test-ldap
    ports:
      - "10389:10389"
      - "10636:10636"
