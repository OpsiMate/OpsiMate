{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsimate.secretName" . }}
  labels:
    {{- include "opsimate.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded API token
  API_TOKEN: {{ .Values.secrets.apiToken | b64enc | quote }}
  # Base64 encoded JWT signing secret: the backend refuses to start without one
  JWT_SECRET: {{ required "secrets.jwtSecret is required (or set secrets.existingSecret to a Secret with a JWT_SECRET key). Generate one with: openssl rand -hex 32" .Values.secrets.jwtSecret | b64enc | quote }}
{{- end }}