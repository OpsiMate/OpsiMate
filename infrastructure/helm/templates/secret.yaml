{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsimate.secretName" . }}
  labels:
    {{- include "opsimate.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded API token
  API_TOKEN: {{ .Values.secrets.apiToken | b64enc | quote }}
  {{- with .Values.secrets.jwtSecret }}
  # Signs login sessions. Optional: without it the backend generates its own on the data volume.
  JWT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.encryptionKey }}
  # Encrypts stored credentials. Optional, like JWT_SECRET.
  ENCRYPTION_KEY: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}