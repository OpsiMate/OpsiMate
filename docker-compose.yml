version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: opsimate/backend:latest
    container_name: opsimate-backend
    ports:
      - "3001:3001"
    volumes:
      - ./data/database:/app/data/database
      - ./data/private-keys:/app/data/private-keys
      - ./config.yml:/app/config/config.yml
    environment:
      - API_TOKEN=opsimate
      - NODE_ENV=production
      - HOST=0.0.0.0
      - CONFIG_FILE=/app/config/config.yml
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: opsimate/backend:latest
    container_name: opsimate-worker
    command: ["node", "apps/server/dist/worker.js"]
    volumes:
      - ./data/database:/app/data/database
      - ./data/private-keys:/app/data/private-keys
      - ./config.yml:/app/config/config.yml
    environment:
      - NODE_ENV=production
      - CONFIG_FILE=/app/config/config.yml
    restart: unless-stopped

  # AI assistants (Claude Code, Cursor, Claude Desktop...) connect to this; it reads
  # alerts and dashboards from the backend with each caller's own token.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: opsimate/mcp:latest
    container_name: opsimate-mcp
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - OPSIMATE_URL=http://backend:3001
      - MCP_PORT=3100
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: opsimate/frontend:latest
    container_name: opsimate-frontend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:3001
      - HOST=0.0.0.0
    restart: unless-stopped
