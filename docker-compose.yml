version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: opsimate/backend:latest
    container_name: opsimate-backend
    ports:
      - "3001:3001"        
    volumes:
      - ./data/database:/app/data/database
      - ./data/private-keys:/app/data/private-keys
      - ./config.yml:/app/config/config.yml
    environment:
      # HTTP worker processes. Unset = auto (CPU count, capped at 4). Set to 1 for a
      # single-core host or to keep memory flat: each worker caches the alert lists.
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-}
      - API_TOKEN=opsimate
      - NODE_ENV=production
      - HOST=0.0.0.0
      - CONFIG_FILE=/app/config/config.yml
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: opsimate/backend:latest
    container_name: opsimate-worker
    command: ["node", "apps/server/dist/worker.js"]
    volumes:
      - ./data/database:/app/data/database
      - ./data/private-keys:/app/data/private-keys
      - ./config.yml:/app/config/config.yml
    environment:
      - NODE_ENV=production
      - CONFIG_FILE=/app/config/config.yml
    restart: unless-stopped

  frontend:
    image: opsimate/frontend:latest
    container_name: opsimate-frontend
    ports:
      - "8080:8080"        
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:3001   
      - HOST=0.0.0.0
    restart: unless-stopped
