version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: opsimate/backend:latest
    container_name: opsimate-backend
    ports:
      - "3001:3001"
    volumes:
      - ./data/database:/app/data/database
      - ./data/private-keys:/app/data/private-keys
      - ./config.yml:/app/config/config.yml
    environment:
      - API_TOKEN=opsimate
      - NODE_ENV=production
      - HOST=0.0.0.0
      - CONFIG_FILE=/app/config/config.yml
      # The keys that sign login sessions and encrypt stored credentials. Leave them unset
      # and OpsiMate generates its own on first start, in ./data/database next to the
      # database (back them up with it). To manage them yourself, put them in a .env next
      # to this file: JWT_SECRET=<openssl rand -hex 32>, ENCRYPTION_KEY=<same>.
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: opsimate/backend:latest
    container_name: opsimate-worker
    command: ["node", "apps/server/dist/worker.js"]
    volumes:
      - ./data/database:/app/data/database
      - ./data/private-keys:/app/data/private-keys
      - ./config.yml:/app/config/config.yml
    environment:
      - NODE_ENV=production
      - CONFIG_FILE=/app/config/config.yml
      # Same key as the backend (generated into ./data/database when unset).
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    restart: unless-stopped

  # AI assistants (Claude Code, Cursor, Claude Desktop...) connect to this; it reads
  # alerts and dashboards from the backend with each caller's own token.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: opsimate/mcp:latest
    container_name: opsimate-mcp
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - OPSIMATE_URL=http://backend:3001
      - MCP_PORT=3100
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: opsimate/frontend:latest
    container_name: opsimate-frontend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:3001
      - HOST=0.0.0.0
    restart: unless-stopped
