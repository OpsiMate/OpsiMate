name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type (patch, minor, major)"
        required: false
        default: patch

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Determine Version Type
        id: version_type
        env:
          INPUT_VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: |
          TYPE="$INPUT_VERSION_TYPE"
          if [ -z "$TYPE" ]; then
            TYPE="patch"
          fi
          echo "Using version type: $TYPE"
          echo "type=$TYPE" >> $GITHUB_OUTPUT

      # fetch-depth: 0 + tags — the version below is read from git, not from the
      # releases API (see the next step for why).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get and Bump Version
        id: version
        run: |
          set -euo pipefail

          # Read the last released version from GIT TAGS, not from
          # api.github.com/releases/latest. That call was unauthenticated, so it is
          # rate limited per runner IP (60/hr, shared across GitHub's pool); on a busy
          # day of merges it returned a body with no tag_name, `jq -r` printed the
          # string "null", and the bump produced the image tag "null..1" — which was
          # pushed to Docker Hub before anything noticed (run 31964001234). Tags are
          # local, need no token, and cannot be rate limited.
          # Full-match grammar, not a glob: the glob 'v[0-9]*.[0-9]*.[0-9]*' also
          # matches things like v1.2.3-1, and `IFS='.' read` then leaves PATCH="3-1",
          # which bash arithmetic evaluates as 3-1=2 — so the "next" version would come
          # out as the CURRENT one and overwrite a published tag. Leading zeros are
          # rejected too (1.02.4 is not semver). Sorted numerically per component.
          LATEST=$(git tag --list 'v*' \
            | sed 's/^v//' \
            | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "::error::No strict v<major>.<minor>.<patch> tag found — cannot determine the current version."
            exit 1
          fi
          echo "Last released version: $LATEST"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          case "${{ steps.version_type.outputs.type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch|*)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Belt and braces: whatever the source, a version that is not strict semver
          # must never reach `docker buildx imagetools create`. Nothing upstream fails
          # loudly on a bad parse — curl, jq and bash arithmetic all exit 0 on garbage —
          # so this is the gate that turns a silent mis-tag into a red build.
          if ! [[ "$NEW_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Computed version '$NEW_VERSION' is not semver (from last tag '$LATEST')."
            exit 1
          fi

          echo "Next version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

  # Each architecture builds NATIVELY on its own runner (amd64 on ubuntu-latest,
  # arm64 on GitHub's free-for-public-repos arm runners) and pushes an arch-suffixed
  # tag. QEMU emulation is gone on purpose: emulating arm64 made node/V8 crash with
  # SIGILL (exit 132) during `pnpm install` often enough that releases were a coin
  # flip — and a current QEMU (setup-qemu-action) did not cure it. Native builds
  # remove the crash class entirely and are much faster.
  build:
    needs: version
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: opsimate
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend Image (${{ matrix.arch }})
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t opsimate/backend:${{ needs.version.outputs.version }}-${{ matrix.arch }} \
            -f Dockerfile.server \
            --push .

      - name: Build and Push Frontend Image (${{ matrix.arch }})
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t opsimate/frontend:${{ needs.version.outputs.version }}-${{ matrix.arch }} \
            -f Dockerfile.client \
            --push .

  # Stitch the per-arch images into the multi-arch tags users actually pull
  # (:<version> and :latest). Runs only after BOTH arch builds succeeded, so a
  # failed arch can never leave a half-populated release tag.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: opsimate
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Multi-Arch Manifests
        run: |
          VERSION=${{ needs.version.outputs.version }}
          for image in backend frontend; do
            docker buildx imagetools create \
              -t opsimate/$image:$VERSION \
              -t opsimate/$image:latest \
              opsimate/$image:$VERSION-amd64 \
              opsimate/$image:$VERSION-arm64
          done

      - name: Update Release Draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
